name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85

      - name: Install dependencies
        run: npm ci

      - name: Test Rust
        run: cargo test -p redactguard-core

      - name: Build CLI
        run: npm run build:cli

      - name: Build WASM
        run: npm run build:wasm

      - name: Build Web
        run: npm run build:web

      - name: Test Web
        run: npm run test -w @redactguard/web

      - name: Lint
        run: npm run lint
        continue-on-error: true

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85

      - name: Check core library
        run: cargo check -p redactguard-core

      - name: Test core library
        run: cargo test -p redactguard-core

  desktop-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85

      - name: Install npm dependencies
        run: npm ci

      - name: Build desktop
        run: npm run build:desktop
