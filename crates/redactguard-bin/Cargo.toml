[package]
name = "redactguard-bin"
version = "0.1.0"
edition = "2021"
description = "RedactGuard CLI binary"

[[bin]]
name = "redactguard"
path = "src/main.rs"

[dependencies]
redactguard-core = { path = "../redactguard-core", features = ["pdf", "fft"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"
